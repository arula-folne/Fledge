name: Release Installer

# v* タグを push すると Windows 用 NSIS インストーラーをビルドし、
# 対応する GitHub Release に添付する。
# 手元ビルドの取り違え（portable 版の誤配布など）を防ぐための正規経路。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $source = Get-Content packages/shared/src/version.ts -Raw
          if ($source -notmatch "APP_VERSION = '([^']+)'") {
            throw 'APP_VERSION not found'
          }
          $appVersion = $Matches[1]
          $tagVersion = "${{ github.ref_name }}".TrimStart('v') -replace '-(a|b|rc)$', '$1'
          if ($appVersion -ne $tagVersion) {
            throw "Release tag version '$tagVersion' does not match APP_VERSION '$appVersion'"
          }

      - name: Build workspace packages
        run: |
          pnpm --filter @fledge/shared build
          pnpm --filter @fledge/i18n build
          pnpm --filter @fledge/core build

      - name: Build desktop app
        run: pnpm --filter @fledge/desktop build

      - name: Package NSIS installer
        # publish は自前の gh release upload で行う（electron-builder の自動 publish は使わない）
        run: pnpm --filter @fledge/desktop exec electron-builder --win nsis --publish never

      - name: Verify artifact is an installer (not portable)
        shell: pwsh
        run: |
          $exe = Get-Item apps/desktop/release/Fledge-Setup.exe
          if (-not $exe) { throw 'Installer not found' }
          if ($exe.Length -lt 10MB) { throw "Installer is unexpectedly small: $($exe.Length) bytes" }
          # NSIS インストーラーにはアンインストーラーが同梱される。portable ビルドには無い
          $listing = & 7z l $exe.FullName | Out-String
          if ($listing -notmatch 'Uninstall') {
            throw "Artifact does not contain an uninstaller - looks like a portable build: $($exe.Name)"
          }
          Write-Host "OK: $($exe.Name) is an NSIS installer"

      - name: Upload installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-Item apps/desktop/release/Fledge-Setup.exe
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            # 常に正式リリース（Latest）として作成。folne web は /releases/latest を参照する
            $ver = $tag.TrimStart('v')
            # RELEASE_NOTES.md に書いた更新内容をリリースページ本文にする
            $notesFile = 'RELEASE_NOTES.md'
            if (-not (Test-Path $notesFile)) {
              throw "Missing $notesFile (write release notes before tagging)"
            }
            gh release create $tag --title "Fledge Ver.$ver" --notes-file $notesFile
          }
          gh release upload $tag $exe.FullName --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: apps/desktop/release/Fledge-Setup.exe
