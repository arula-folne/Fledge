name: Release Installer

# v* タグを push すると Windows 用 NSIS インストーラーをビルドし、
# 対応する GitHub Release に添付する。
# 正規版は asset 付きで作成し、公開直後に /releases/latest を検証する
# （asset 無し Latest が一瞬でも立たないようにする）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $source = Get-Content packages/shared/src/version.ts -Raw
          if ($source -notmatch "APP_VERSION = '([^']+)'") {
            throw 'APP_VERSION not found'
          }
          $appVersion = $Matches[1]
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ($appVersion -ne $tagVersion) {
            throw "Release tag version '$tagVersion' does not match APP_VERSION '$appVersion'"
          }

      - name: Build workspace packages
        run: |
          pnpm --filter @fledge/shared build
          pnpm --filter @fledge/i18n build

      - name: Build Tauri NSIS installer
        run: pnpm tauri:build

      - name: Locate installer
        id: artifact
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path target/release/bundle/nsis -Filter 'Fledge_*_x64-setup.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw 'Installer not found under target/release/bundle/nsis' }
          if ($exe.Length -lt 5MB) { throw "Installer is unexpectedly small: $($exe.Length) bytes" }
          Write-Host "OK: $($exe.FullName)"
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish installer release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          $exe = "${{ steps.artifact.outputs.path }}"
          $notesFile = 'RELEASE_NOTES.md'
          if (-not (Test-Path $notesFile)) {
            throw "Missing $notesFile (write release notes before tagging)"
          }

          $isPrerelease = $ver -match '(a|b|c|ut|up)$'
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)

          if (-not $exists) {
            # asset を同時添付して作成し、asset 無し Latest の隙間を作らない
            if ($isPrerelease) {
              gh release create $tag $exe `
                --title "Fledge Ver.$ver" `
                --notes-file $notesFile `
                --prerelease
            } else {
              gh release create $tag $exe `
                --title "Fledge Ver.$ver" `
                --notes-file $notesFile `
                --latest
            }
          } else {
            gh release upload $tag $exe --clobber
            if ($isPrerelease) {
              gh release edit $tag --prerelease
            } else {
              gh release edit $tag --prerelease=false --latest
            }
          }

          if (-not $isPrerelease) {
            $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json
            if ($latest.tag_name -ne $tag) {
              throw "Expected /releases/latest tag '$tag' but got '$($latest.tag_name)'"
            }
            $assetNames = @($latest.assets | ForEach-Object { $_.name })
            $exeName = [System.IO.Path]::GetFileName($exe)
            if ($assetNames -notcontains $exeName) {
              throw "/releases/latest is missing installer asset '$exeName' (have: $($assetNames -join ', '))"
            }
            Write-Host "Verified latest=$tag asset=$exeName"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: ${{ steps.artifact.outputs.path }}
